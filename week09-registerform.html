<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録フォーム</title>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-red-300">

<!-- ヘッダー -->
<header class="shadow bg-white flex justify-between">

    <h1 class="font-bold text-blue-500 text-2xl px-2 py-2">
        登録フォーム
    </h1>

    <ul class="flex pt-4">

        <li class="px-2 hover:underline hover:text-blue-500 cursor-pointer">
            HOME
        </li>

        <li class="px-2 hover:underline hover:text-blue-500 cursor-pointer">
            会社について
        </li>

        <li class="px-2 hover:underline hover:text-blue-500 cursor-pointer">
            サポート
        </li>

    </ul>

</header>


<!-- メイン -->
<section class="flex flex-col justify-center items-center">

    <form id="signupForm" novalidate>

        <!-- 名前 -->
        <div class="bg-white rounded-lg mt-8 w-96">

            <h2 class="text-xl font-bold text-green-300 text-center px-2 pt-4">
                お名前登録
            </h2>

            <label
                for="name"
                class="block text-sm font-medium text-gray-700 px-3 mb-1 pt-2">
                お名前
            </label>

            <input
                type="text"
                id="name"
                required
                class="w-full px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 rounded-lg"
                placeholder="例：松浦直生">

            <!-- 名前のエラー -->
            <p
                id="nameError"
                class="text-red-500 text-sm px-3 pb-2">
            </p>

        </div>


        <!-- メールアドレス -->
        <div class="mt-8 bg-white rounded-lg w-96">

            <h2 class="text-xl text-green-300 mb-1 font-bold px-2 text-center pt-4">
                メールアドレス
            </h2>

            <label
                for="email"
                class="block text-sm text-gray-700 font-medium mb-1 px-3 pt-2">
                連絡のつくご自身のメールアドレス
            </label>

            <input
                type="email"
                id="email"
                required
                class="w-full rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="例：naokimatsuura0528@gmail.com">

            <!-- メールのエラー -->
            <p
                id="emailError"
                class="text-red-500 text-sm px-3 pb-2">
            </p>

        </div>


        <!-- パスワード -->
        <div class="mt-8 bg-white rounded-lg w-96">

            <h2 class="text-xl text-green-300 font-bold px-2 text-center pt-4">
                パスワード
            </h2>

            <label
                for="password"
                class="block text-sm text-gray-700 mb-1 font-medium px-3 pt-2">
                8文字以上のパスワード
            </label>

            <input
                type="password"
                id="password"
                required
                minlength="8"
                class="w-full rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="例：Mnaoki190528">

            <!-- パスワードのエラー -->
            <p
                id="passwordError"
                class="text-red-500 text-sm px-3 pb-2">
            </p>

        </div>


        <!-- 利用規約 -->
        <div class="flex items-center gap-2 bg-white mt-8 rounded-lg w-96 flex-col">

            <h2 class="text-xl text-green-300 font-bold px-2 text-center pt-4">
                同意チェック欄
            </h2>

            <p class="px-4">
                ■ 利用規約およびプライバシーポリシーへの同意

                当フォームからご入力いただいた個人情報は、
                本サービスの提供および運営、
                お問い合わせ対応のために利用いたします。

                個人情報は適切に管理し、
                法令に基づく場合を除き、
                本人の同意なく第三者に提供いたしません。
            </p>

            <div class="flex flex-row items-center pb-4">

                <input
                    type="checkbox"
                    id="agree"
                    required>

                <label
                    for="agree"
                    class="text-sm text-gray-700 p-2">
                    利用規約に同意する
                </label>

            </div>

            <!-- 同意のエラー -->
            <p
                id="agreeError"
                class="text-red-500 text-sm pb-2">
            </p>

        </div>


        <!-- 成功・全体エラーメッセージ -->
        <p
            id="message"
            class="text-sm font-medium mt-4">
        </p>


        <!-- 登録ボタン -->
        <button
            type="submit"
            class="bg-blue-500 text-white font-bold py-2 rounded hover:bg-blue-700 w-96 mt-6 mb-4">

            登録する

        </button>

    </form>

</section>


<!-- フッター -->
<footer class="bg-blue-200 flex justify-between">

    <h2 class="pt-6 pb-2 text-lg font-bold px-2">
        株式会社まっちゃん
    </h2>

    <ul class="px-2">

        <li class="pt-2">
            電話番号
        </li>

        <li class="py-2">
            住所
        </li>

    </ul>

</footer>


<!-- JavaScript -->
<script>

    // フォームとメッセージを取得
    const form = document.getElementById("signupForm");

    const message = document.getElementById("message");


    // フォーム送信時の処理
    form.addEventListener("submit", (event) => {

        // ページのリロードを防ぐ
        event.preventDefault();


        // 入力値を取得
        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const agree =
            document.getElementById("agree").checked;


        // エラーメッセージの要素を取得
        const nameError =
            document.getElementById("nameError");

        const emailError =
            document.getElementById("emailError");

        const passwordError =
            document.getElementById("passwordError");

        const agreeError =
            document.getElementById("agreeError");


        // 前回のエラーを消す
        nameError.textContent = "";

        emailError.textContent = "";

        passwordError.textContent = "";

        agreeError.textContent = "";

        message.textContent = "";


        // エラーがあるかどうか
        let hasError = false;


        // 名前のチェック
        if (name === "") {

            nameError.textContent =
                "お名前を入力してください";

            hasError = true;

        }


        // メールアドレスのチェック
        if (email === "") {

            emailError.textContent =
                "メールアドレスを入力してください";

            hasError = true;

        }


        // パスワードのチェック
        if (password.length < 8) {

            passwordError.textContent =
                "パスワードは8文字以上で入力してください";

            hasError = true;

        }


        // 利用規約のチェック
        if (!agree) {

            agreeError.textContent =
                "利用規約に同意してください";

            hasError = true;

        }


        // 1つでもエラーがあれば終了
        if (hasError) {

            return;

        }


        // すべての入力が正しい場合
        message.textContent =
            "登録完了！ようこそ、" + name + " さん！";

        message.className =
            "text-sm font-medium text-green-600";

    });

</script>

</body>

</html>
