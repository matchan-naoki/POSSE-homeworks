<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300">

    <header class="bg-gray-500 w-full flex justify-between">
        <h1 class="font-bold text-2xl p-4 text-white">
            GitHubユーザー検索
        </h1>
    </header>

    <section class="flex justify-center items-center bg-white w-fit my-8 rounded-lg shadow-lg mx-auto p-4 gap-3">
        <label for="username" class="font-bold">
            GitHubユーザー名
        </label>

        <input
            type="text"
            id="username"
            placeholder="GitHubユーザー名を入力"
            class="border rounded px-3 py-2"
        >

        <button
            id="searchBtn"
            class="bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600"
        >
            検索
        </button>
    </section>

    <div
        id="result"
        class="max-w-md mx-auto"
    ></div>

    <script>
        const searchBtn = document.getElementById("searchBtn");
        const result = document.getElementById("result");

        searchBtn.addEventListener("click", async () => {
            const username = document.getElementById("username").value.trim();

            if (!username) {
                result.innerHTML =
                    "<p class='text-center text-red-500'>ユーザー名を入力してください。</p>";
                return;
            }

            // ローディング表示
            result.innerHTML =
                "<p class='text-center text-gray-600'>読み込み中...</p>";

            try {
                const response = await fetch(
                    `https://api.github.com/users/${username}`
                );

                // 通信成功か確認
                if (!response.ok) {
                    result.innerHTML =
                        "<p class='text-center text-red-500'>ユーザーが見つかりませんでした</p>";
                    return;
                }

                const user = await response.json();

                // Consoleで確認
                console.log(user);

                result.innerHTML = `
                    <div class="bg-white rounded-lg shadow-lg p-6 text-center">

                        <img
                            src="${user.avatar_url}"
                            alt="${user.login}"
                            class="w-32 h-32 rounded-full mx-auto mb-4"
                        >

                        <h2 class="text-2xl font-bold">
                            ${user.name ?? "名前なし"}
                        </h2>

                        <p class="text-gray-600 mt-2">
                            ${user.bio ?? "自己紹介はありません"}
                        </p>

                        <p class="mt-4 font-semibold">
                            フォロワー数：${user.followers}
                        </p>

                        <p class="font-semibold">
                            公開リポジトリ数：${user.public_repos}
                        </p>

                        <a
                            href="${user.html_url}"
                            target="_blank"
                            class="inline-block mt-4 text-blue-500 underline"
                        >
                            GitHubプロフィールを見る
                        </a>

                    </div>
                `;

            } catch (error) {
                console.error(error);
                result.innerHTML =
                    "<p class='text-center text-red-500'>エラーが発生しました。</p>";
            }
        });
    </script>

</body>
</html>
